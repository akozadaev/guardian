version: "2"

run:
  timeout: 5m
  tests: true
  concurrency: 4

output:
  formats:
    text:
      path: stdout
      colors: true

linters:
  enable:
    - govet
    - revive
    - errcheck
    - staticcheck
    - unused
    - gocritic
    - bodyclose
  disable:
    - depguard
  settings:
    revive:
      severity: warning
      rules:
        - name: indent-error-flow
        - name: var-naming
          arguments:
            - [ "API", "ASCII", "CPU", "CSS", "DNS", "EOF", "GUID", "HTML", "HTTP", "HTTPS", "ID", "IP", "JSON", "QPS", "RAM", "RPC", "SLA", "SMTP", "SQL", "SSH", "TCP", "TLS", "TTL", "UDP", "UI", "UID", "UUID", "URI", "URL", "UTF8", "VM", "XML", "XSRF", "XSS" ]
  exclusions:
    paths:
      - ".*\\.gen\\.go$"
      - ".*_test\\.go$"
      - migrations/