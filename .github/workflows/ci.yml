name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Проверка актуальности сгенерированных файлов
        run: |
          go generate ./...
          git diff --exit-code -- docs/openapi.yaml
      - name: Тесты
        run: go test ./...
